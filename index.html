<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللوائح والقوانين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            height: 100vh; 
            background-color: #000; 
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .login-card {
            background: #121212;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(255,255,255,0.08);
            text-align: center;
            width: 90%;
            max-width: 380px;
            border: 1px solid #222;
        }

        .login-card h2 { 
            margin-bottom: 20px; 
            color: #fff; 
            font-size: 20px; 
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #333;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
        }

        .login-card input:focus { 
            border-color: #5865F2; 
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: #5865F2;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .error-msg { 
            color: #ff4d4d; 
            font-size: 14px; 
            margin-top: 14px; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>عرض اللوائح والقوانين</h2>
        <input type="password" id="password-input" placeholder="أدخل كلمة السر">
        <button onclick="checkPassword()">دخول</button>
        <p id="error-msg" class="error-msg">كلمة السر غير صحيحة!</p>
    </div>

    <script>
        const SECRET_PASSWORD = "1234"; // كلمة السر الخاصة بك

        // رابط اللوائح المباشر
        const RULES_URL = "https://h5.wepartytime.net/static/ly/managerCenter/index.html?uid=1134615&token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODY5MzIyNzQsImlhdCI6MTc4NjMyNzQ3NCwiaXNzIjoicHR1IiwianRpIjoiNTU1MzhjODgtMjBkZi00YzQ4LTk5YTQtOTc1NGY0MTgxMzlhIiwidWlkIjoiMTEyOTI1MiJ9.rFMtX22YSICp6RbyqT9GGsMwkzCWqbfr0jX43uO7aN4&lan=ar&lang=ar#/rules";

        function checkPassword() {
            const inputVal = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === SECRET_PASSWORD) {
                // التوجيه المباشر للرابط لتفادي إحاطة الحظر
                window.location.href = RULES_URL;
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
