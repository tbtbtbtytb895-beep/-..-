<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحه تحكم فـ✗ـوضـوي..❵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* 1. الشاشة الترحيبية */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2a0800 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            text-align: center;
            padding: 20px;
        }

        .fire-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 
                0 0 4px #fff,
                0 -4px 8px #ff3300,
                0 -8px 16px #ff6600,
                0 -12px 24px #ff9900;
            animation: firePulse 1.2s infinite alternate ease-in-out;
        }

        @keyframes firePulse {
            0% {
                transform: scale(1);
                text-shadow: 
                    0 0 4px #fff,
                    0 -4px 8px #ff3300,
                    0 -8px 16px #ff6600,
                    0 -12px 24px #ff9900;
            }
            100% {
                transform: scale(1.04);
                text-shadow: 
                    0 0 8px #fff,
                    0 -6px 12px #ff0000,
                    0 -12px 22px #ff5500,
                    0 -18px 32px #ffaa00;
            }
        }

        .logo-box {
            border: 2px solid #ff3300;
            border-radius: 20px;
            padding: 22px 18px;
            background: rgba(20, 5, 0, 0.85);
            box-shadow: 0 0 30px rgba(255, 51, 0, 0.35);
            margin-bottom: 35px;
            max-width: 90%;
        }

        .slogan {
            font-size: 17px;
            color: #f5f5f5;
            line-height: 1.7;
            font-weight: 500;
        }

        .start-btn {
            background: linear-gradient(90deg, #ff3300, #d60000);
            color: #ffffff;
            border: none;
            padding: 15px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 51, 0, 0.5);
            transition: transform 0.2s;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* 2. شاشة كلمة السر */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background-color: #0a0a0a;
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            border: 1px solid #222222;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        .login-card h3 {
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 18px;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #333333;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            background-color: #141414;
            color: #ffffff;
            outline: none;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff3300, #990000);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        /* 3. شاشة عرض المحتوى بضبط المنتصف والتكبير الشديد */
        #content-wrapper {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-color: #000000;
        }

        iframe {
            position: absolute;
            top: -300px;
            left: 50%;
            width: 100%;
            height: calc(100vh + 300px);
            border: none;
            background-color: #000000;
            /* تكبير الشاشة وإزاحتها لتتوسط منطقة "اللوائح" تماماً */
            transform: translateX(-50%) scale(2.2);
            transform-origin: 50% 200px;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة الترحيب -->
    <div id="welcome-screen">
        <h1 class="fire-title">لوحه تحكم فـ✗ـوضـوي..❵ 🔥</h1>
        
        <div class="logo-box">
            <p class="slogan">☕ڪِــࢪفــت اࢦــكــࢦ لاجــࢦ ࢪاحــت بــاࢦــي𖥨✨₎ٌ.</p>
        </div>

        <button class="start-btn" onclick="goToLogin()">دخول النظام</button>
    </div>

    <!-- 2. شاشة كلمة السر -->
    <div id="login-screen">
        <div class="login-card">
            <h3>أدخل كلمة السر للمتابعة</h3>
            <input type="password" id="password-input" placeholder="كلمة السر">
            <button onclick="checkPassword()">تأكيد الدخول</button>
            <p id="error-msg" class="error-msg">كلمة السر غير صحيحة!</p>
        </div>
    </div>

    <!-- 3. شاشة العرض الرئيسية -->
    <div id="content-wrapper">
        <iframe id="main-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const SECRET_PASSWORD = "999002";

        const RULES_URL = "https://h5.wepartytime.net/static/ly/managerCenter/index.html?uid=1134615&token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODY5MzIyNzQsImlhdCI6MTc4NjMyNzQ3NCwiaXNzIjoicHR1IiwianRpIjoiNTU1MzhjODgtMjBkZi00YzQ4LTk5YTQtOTc1NGY0MTgxMzlhIiwidWlkIjoiMTEyOTI1MiJ9.rFMtX22YSICp6RbyqT9GGsMwkzCWqbfr0jX43uO7aN4&lan=ar&lang=ar#/rules";

        function goToLogin() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('password-input').focus();
        }

        function checkPassword() {
            const inputVal = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === SECRET_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('content-wrapper').style.display = 'block';
                document.getElementById('main-frame').src = RULES_URL;
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
